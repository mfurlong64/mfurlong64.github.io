<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corsairs of Aleria</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="sb">
  <div class="sb-logo">
    <span class="anchor">⚓</span>
    <h1>Corsairs of Aleria</h1>
    <div class="tag">Tactical Naval Combat</div>
  </div>
  <div class="phase-pill" id="phasePill">Setup</div>

  <div id="progress" class="progress-row" style="display:none">
    <div class="progress-lbl"><span>Red</span><span id="progRedTxt"></span></div>
    <div class="progress-bar"><div class="progress-fill red" id="progRed"></div></div>
    <div class="progress-lbl"><span>Blue</span><span id="progBlueTxt"></span></div>
    <div class="progress-bar"><div class="progress-fill blue" id="progBlue"></div></div>
  </div>

  <div class="fleet-lbl">— Red Fleet —</div>
  <div id="p1f"></div>
  <div class="fleet-lbl" style="margin-top:3px">— Blue Fleet —</div>
  <div id="p2f"></div>

  <div id="moveConfirm" class="move-confirm" style="display:none">
    <div class="btn confirm" onclick="confirmMove()">Confirm Move ✓</div>
    <div class="btn" onclick="undoMove()" style="color:#2a4060">↩ Undo</div>
  </div>

  <div id="subBtns" class="sub-btns" style="display:none">
    <div id="holdBtn" class="btn" onclick="holdPosition()" style="display:none;font-size:10px;color:#2a4055">Hold Position</div>
    <div id="passBtn" class="btn" onclick="passShot()"     style="display:none;font-size:10px;color:#2a4055">Pass — No Fire</div>
  </div>

  <div id="actionBtn" class="btn primary" onclick="onActionBtn()" style="display:none">Start Game →</div>
  <div class="info-box" id="infoBox">Click a ship to select<br><span class="kb">R</span> rotate &nbsp;<span class="kb">ESC</span> deselect</div>
</div>

<script src="data/ships.js"></script>
<script src="data/map.js"></script>
<script src="data/rules.js"></script>
<script src="js/config.js"></script>
<script src="js/hex.js"></script>
<script src="js/ships.js"></script>
<script src="js/combat.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
